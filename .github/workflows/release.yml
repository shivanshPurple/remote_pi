name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-windows:
    name: Windows Setup Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows Release
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.2.0" }
          New-Item -ItemType Directory -Force -Path dist
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
              $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
            } else {
              choco install innosetup --no-progress -y
              $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
            }
          }
          iscc /DMyAppVersion="$version" packaging/windows/setup.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/RemotePi-Setup-x64.exe

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux Release
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package AppImage
        run: |
          chmod +x packaging/linux/build_appimage.sh
          bash packaging/linux/build_appimage.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/RemotePi-x86_64.AppImage

  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android Release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Stage Android APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/RemotePi.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/RemotePi.apk

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-raw

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p dist
          cp dist-raw/windows-installer/RemotePi-Setup-x64.exe dist/
          cp dist-raw/linux-appimage/RemotePi-x86_64.AppImage dist/
          cp dist-raw/android-apk/RemotePi.apk dist/
          cd dist
          sha256sum RemotePi-Setup-x64.exe RemotePi-x86_64.AppImage RemotePi.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Create or Update GitHub Release
        run: |
          VERSION="${{ env.RELEASE_TAG }}"
          TITLE="Remote Pi ${VERSION}"
          
          NOTES=$(cat << 'EOF'
          ### Downloads
          - **Windows**: `RemotePi-Setup-x64.exe` (Setup installer with shortcuts & uninstaller)
          - **Linux**: `RemotePi-x86_64.AppImage` (Universal executable, run with `chmod +x`)
          - **Android**: `RemotePi.apk` (Direct install APK)
          
          Verify package integrity with the included `SHA256SUMS`.
          EOF
          )
          
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
